name: QALQON V4.4 Uploaded Source CI

on:
  push:
    branches: [ v4-4-strict-gate ]
    paths:
      - '.build_payload/**'
      - '.github/workflows/v44-build-uploaded-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore uploaded V4.4 source overlay
        run: |
          # Remove stale V3 Kotlin/tests/backend so CI validates the uploaded V4.4 source,
          # while keeping existing binary Android resources such as the official icon.
          rm -rf android/app/src/main/java android/app/src/test android/app/src/androidTest backend
          cat .build_payload/v44/p0.txt .build_payload/v44/p1.txt .build_payload/v44/p2.txt .build_payload/v44/p3.txt > /tmp/v44.b64
          base64 -d /tmp/v44.b64 > /tmp/v44.tar.gz
          tar -xzf /tmp/v44.tar.gz -C .

      - name: Apply targeted V4.4 Android fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path("android/app/src/main/java/uz/qalqon/security/ui/UiUtils.kt")
          text = ui.read_text()
          old = """    val state = produceState<ImageBitmap?>(null, packageName) {
        value = withContext(Dispatchers.IO) { runCatching { context.packageManager.getApplicationIcon(packageName).toImageBitmap() }.getOrNull() }
    }"""
          new = """    val state = produceState<ImageBitmap?>(initialValue = null, key1 = packageName) {
        val icon = withContext(Dispatchers.IO) {
            runCatching { context.packageManager.getApplicationIcon(packageName).toImageBitmap() }.getOrNull()
        }
        value = icon
    }"""
          if old not in text:
              raise SystemExit("UiUtils.kt expected block not found")
          ui.write_text(text.replace(old, new))

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">'
          )
          text = text.replace(
              '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />',
              '<uses-permission\n        android:name="android.permission.QUERY_ALL_PACKAGES"\n        tools:ignore="QueryAllPackagesPermission" />'
          )
          manifest.write_text(text)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Check backend syntax
        run: python -m compileall -q backend/app

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Android unit tests
        run: gradle -p android --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle -p android --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QALQON-V4.4-STRICT-GATE-debug.apk
          sha256sum QALQON-V4.4-STRICT-GATE-debug.apk > QALQON-V4.4-STRICT-GATE-debug.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QALQON-V4.4-STRICT-GATE-APK
          path: |
            QALQON-V4.4-STRICT-GATE-debug.apk
            QALQON-V4.4-STRICT-GATE-debug.sha256
          if-no-files-found: error
          retention-days: 14
