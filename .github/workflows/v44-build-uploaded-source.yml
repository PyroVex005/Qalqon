name: QALQON V4.4 Uploaded Source CI

on:
  push:
    branches: [ v4-4-strict-gate ]
    paths:
      - '.build_payload/**'
      - '.github/workflows/v44-build-uploaded-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore uploaded V4.4 source overlay
        run: |
          cat .build_payload/v44/p0.txt .build_payload/v44/p1.txt .build_payload/v44/p2.txt .build_payload/v44/p3.txt > /tmp/v44.b64
          base64 -d /tmp/v44.b64 > /tmp/v44.tar.gz
          tar -xzf /tmp/v44.tar.gz -C .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Check backend syntax
        run: python -m compileall -q backend/app

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Android unit tests
        run: gradle -p android --no-daemon :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle -p android --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QALQON-V4.4-STRICT-GATE-debug.apk
          sha256sum QALQON-V4.4-STRICT-GATE-debug.apk > QALQON-V4.4-STRICT-GATE-debug.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QALQON-V4.4-STRICT-GATE-APK
          path: |
            QALQON-V4.4-STRICT-GATE-debug.apk
            QALQON-V4.4-STRICT-GATE-debug.sha256
          if-no-files-found: error
          retention-days: 14
