name: QALQON V3 Verified Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/bootstrap-build.yml'
      - 'V3_UPGRADE_REPORT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle -p android --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle -p android --no-daemon lintDebug

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" QALQON-ULTIMATE-V3.apk
          sha256sum QALQON-ULTIMATE-V3.apk | tee QALQON-ULTIMATE-V3.sha256
          unzip -t QALQON-ULTIMATE-V3.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QALQON-ULTIMATE-V3-APK
          path: |
            QALQON-ULTIMATE-V3.apk
            QALQON-ULTIMATE-V3.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QALQON-V3-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14
