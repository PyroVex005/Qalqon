name: Build Qalqon APK

on:
  push:
    branches: [ main ]
    paths:
      - '.build_payload/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix known Kotlin syntax issue
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/uz/qalqon/security/ui/QalqonRoot.kt")
          s = p.read_text()
          marker = "// QALQON_BUILD_SYNTAX_FIXED"
          if marker not in s:
              target = "\n@Composable private fun ScanScreen"
              if target not in s:
                  raise SystemExit("ScanScreen marker not found")
              s = s.replace(target, "\n}\n\n" + marker + "\n@Composable private fun ScanScreen", 1)
              s = s.rstrip() + "\n}\n"
              p.write_text(s)
          PY

      - name: Commit syntax fix
        run: |
          git config user.name "Qalqon Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/uz/qalqon/security/ui/QalqonRoot.kt
          git diff --cached --quiet || git commit -m "Fix QalqonRoot Compose syntax [skip ci]"
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Qalqon.apk

      - name: Upload Qalqon APK
        uses: actions/upload-artifact@v4
        with:
          name: Qalqon-APK
          path: Qalqon.apk
          if-no-files-found: error
          retention-days: 14
